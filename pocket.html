<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14182a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stacy's @ Melrose</title>
<!-- ensureSignFonts() loads these faces before the canvas sign and mural text are
     drawn; without the stylesheet they don't exist and both silently fall back to
     a system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pocket.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="boot">Opening up&hellip;</div>
<div id="err" hidden></div>

<header id="top">
  <div class="ident">
    <div class="name">Stacy's <span>@ Melrose</span></div>
    <section id="card" hidden>
      <div class="ev-when" id="ev-when">TONIGHT</div>
      <div class="ev-name" id="ev-name">&mdash;</div>
      <div class="ev-time" id="ev-time"></div>
      <div class="ev-tags" id="ev-tags"></div>
    </section>
  </div>

  <div class="when">
    <div id="state" class="pill">
      <span id="clock">--:--</span><b id="state-label">&mdash;</b>
    </div>
    <div class="day" id="weekday">&mdash;</div>
    <div class="date" id="date">&mdash;</div>
    <div class="cond">
      <span class="ic" id="wx-icon"></span>
      <span class="temp" id="temp"></span>
    </div>
    <div class="moonrow">
      <span class="ic moon" id="moon-icon"></span>
      <span class="moonname" id="moon-name"></span>
    </div>
  </div>
</header>

<div id="controls">
  <button id="spin" class="on" type="button" aria-label="Toggle auto-rotate"></button>
  <button id="creative" type="button" aria-pressed="false" aria-label="Toggle creative mode — pretend the bar is open" title="Creative mode: pretend we're open"></button>
  <button id="trash" type="button" aria-label="Take out the trash"></button>
  <button id="mist" type="button" aria-pressed="false" aria-label="Toggle patio misters"></button>
  <button id="sick" type="button" aria-label="Someone gets sick in the lot"></button>
  <button id="liquor" type="button" aria-label="Liquor delivery" title="Liquor delivery"></button>
  <button id="taco" type="button" aria-label="Taco stand" title="Taco stand — set up next to the pole sign" aria-pressed="false"></button>
  <button id="ride" type="button" aria-label="Call a Gaymo — tap to pick up, hold or double-tap to drop off" title="Tap: pick up · Hold / double-tap: drop off"></button>
  <button id="ufo" type="button" aria-label="Alien abduction on the sidewalk" title="UFO abduction"></button>
  <button id="bird" type="button" aria-label="Pigeon flyby" title="Pigeon flyby"></button>
  <button id="inside" type="button" aria-label="Step inside Stacy's" title="Step inside" aria-pressed="false"></button>
</div>

<button id="exit-inside" type="button" hidden aria-label="Back to the lot">← Lot</button>

<!-- Closed-hours pickup: Gaymo texts that nobody is free to ride -->
<div id="sms" hidden>
  <div class="sms-shell">
    <div class="sms-app">Gaymo</div>
    <div class="sms-bubble">
      <div class="sms-body" id="sms-body"></div>
      <div class="sms-meta" id="sms-meta">now</div>
    </div>
  </div>
</div>

<!-- iPhone-style lock-screen / banner notification over the waiting guest -->
<div id="float-sms" hidden>
  <div class="ios-notif">
    <div class="ios-notif-icon" aria-hidden="true">G</div>
    <div class="ios-notif-main">
      <div class="ios-notif-row">
        <span class="ios-notif-app" id="float-sms-from">Gaymo</span>
        <span class="ios-notif-time">now</span>
      </div>
      <div class="ios-notif-title">Messages</div>
      <div class="ios-notif-body" id="float-sms-body">Your Gaymo will arrive shortly!</div>
    </div>
  </div>
</div>

<script type="module" src="js/pocket.js"></script>
</body>
</html>
